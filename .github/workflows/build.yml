name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows x86
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check NSIS
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $nsis)) {
            throw 'NSIS is missing from the runner'
          }
          & $nsis /VERSION

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DSAMP_TRACY=OFF

      - name: Build project
        run: |
          foreach ($config in @('Release', 'RelWithDebInfo', 'Debug')) {
            cmake --build build --config $config --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer
        run: cmake --build build --config Release --target installer --parallel 4

      - name: Package builds
        run: |
          New-Item -ItemType Directory -Path build/nightly -Force | Out-Null
          foreach ($config in @('Release', 'RelWithDebInfo', 'Debug')) {
            $package = "build/zip/$config"
            New-Item -ItemType Directory -Path "$package/tools" -Force | Out-Null
            Copy-Item -LiteralPath assets/samp.exe, assets/payload/samp-license.txt -Destination $package -Force
            Copy-Item -LiteralPath "build/$config/samp.dll" -Destination $package -Force
            foreach ($tool in @('img', 'rcon', 'saa', 'launcher')) {
              $name = if ($tool -eq 'launcher') { 'samp_debug' } else { $tool }
              Copy-Item -LiteralPath "build/tools/$tool/$config/$name.exe" -Destination "$package/tools" -Force
              if ($config -ne 'Release') {
                Copy-Item -LiteralPath "build/tools/$tool/$config/$name.pdb" -Destination "$package/tools" -Force
              }
            }
            if ($config -ne 'Release') {
              Copy-Item -LiteralPath "build/$config/samp.pdb" -Destination $package -Force
            }
            Compress-Archive -Path "$package/*" -DestinationPath "build/nightly/$config.zip" -Force
          }
          Copy-Item -LiteralPath build/installer/Release/sa-mp-0.3.DL-R1-install.exe -Destination build/nightly -Force

      - name: Upload builds
        uses: actions/upload-artifact@v7
        with:
          name: nightly-files
          path: build/nightly/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Update nightly release
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          name: nightly-files
          path: nightly

      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Automated Win32 builds from commit $GITHUB_SHA.

          - Installer: Release build.
          - Release.zip: optimized client and tools.
          - RelWithDebInfo.zip: optimized client and tools with symbols.
          - Debug.zip: debug client and tools with symbols.

          These files are replaced after each successful master build.
          EOF
          if gh release view nightly > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
            gh release upload nightly nightly/* --clobber
            gh release edit nightly --title Nightly --notes-file notes.md --prerelease --latest=false
          else
            gh release create nightly nightly/* --target "$GITHUB_SHA" --title Nightly --notes-file notes.md --prerelease --latest=false
          fi
